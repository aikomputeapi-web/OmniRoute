version: '3.8'

services:
  proxy-scraper:
    image: ubuntu:24.04
    container_name: omniroute-proxy-scraper
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./proxy_scraper_data:/app/data
      - ./proxy_scraper_config:/app/config
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      bash -c "
      apt-get update -qq &&
      apt-get install -y -qq wget ca-certificates &&
      cd /app &&
      wget -q https://github.com/monosans/proxy-scraper-checker/releases/latest/download/proxy-scraper-checker-linux-amd64 -O proxy-scraper-checker &&
      chmod +x proxy-scraper-checker &&
      mkdir -p /app/data/proxies &&
      cd /app/data &&
      while true; do
        echo '[$(date)] Starting proxy scrape and validation (USA only)...' &&
        /app/proxy-scraper-checker --output-folder ./proxies --timeout 5 --sources https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt --countries US &&
        echo '[$(date)] Scrape complete. Sleeping for 1 hour...' &&
        sleep 3600
      done
      "
    networks:
      - omniroute-network

networks:
  omniroute-network:
    driver: bridge
