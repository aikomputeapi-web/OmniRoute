services:
  proxy-scraper:
    build:
      context: ./proxy_scraper_build
      dockerfile: Dockerfile
    container_name: omniroute-proxy-scraper
    restart: unless-stopped
    env_file: .env
    init: true
    tty: false
    stdin_open: false
    working_dir: /home/app
    volumes:
      - ./proxy_scraper_data:/app/data
      - ./proxy_scraper_config:/app/config
    command:
      - bash
      - -c
      - |
        set -ex
        # Create a symlink to config in home directory (writable by app user)
        if [ -f /app/config/config.toml ]; then
          ln -sf /app/config/config.toml /home/app/config.toml
        fi
        mkdir -p /app/data/out
        # All output goes to log file on shared volume (tailed by OmniRoute UI)
        exec > >(tee -a /app/data/scraper.log) 2>&1
        while true; do
          # Clear any stale trigger file before starting a scrape
          rm -f /app/data/trigger_scrape
          echo "[$(date)] Starting proxy scrape and validation..."
          /app/proxy-scraper-checker --config /home/app/config.toml || true
          # Copy output files to mounted volume
          cp -f /home/app/out/proxies/http.txt /app/data/out/ 2>/dev/null || true
          cp -f /home/app/out/proxies/socks4.txt /app/data/out/ 2>/dev/null || true
          cp -f /home/app/out/proxies/socks5.txt /app/data/out/ 2>/dev/null || true
          cp -f /home/app/out/proxies/all.txt /app/data/out/ 2>/dev/null || true
          cp -f /home/app/out/proxies.json /app/data/out/ 2>/dev/null || true
          cp -f /home/app/out/proxies_pretty.json /app/data/out/ 2>/dev/null || true
          # Auto-sync proxies to OmniRoute
          echo "[$(date)] Syncing proxies to OmniRoute..."
          curl -s -X POST http://host.docker.internal:20128/api/settings/free-proxies/sync \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $$OMNIROUTE_API_KEY" \
            -d '{"sources": ["proxyscraper"]}' || true
          echo "[$(date)] Scrape complete. Waiting up to 1 hour (or until manual trigger)..."
          # Poll every 10 s for a trigger file instead of a solid sleep 3600.
          # Uses a deadline timestamp to avoid variable-scope issues with tee subshells.
          DEADLINE=$(( $(date +%s) + 3600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -f /app/data/trigger_scrape ]; then
              echo "[$(date)] Manual trigger detected — starting fresh scrape immediately."
              break
            fi
            sleep 10
          done
        done
    networks:
      - omniroute-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  omniroute-network:
    driver: bridge
