services:
  proxy_pool:
    image: jhao104/proxy_pool:latest
    container_name: proxy_pool
    ports:
      - "5010:5010"
    entrypoint:
      [
        "/sbin/tini",
        "--",
        "sh",
        "-c",
        "apk add --no-cache bash > /dev/null 2>&1 && exec bash proxy_pool.sh start --fg",
      ]
    environment:
      - DB_CONN=redis://proxypool-redis:6379/0
    depends_on:
      proxypool-redis:
        condition: service_healthy
    volumes:
      - ./proxy_pool_config:/app/config
    networks:
      - proxypool-network
    restart: unless-stopped

  proxypool-redis:
    image: redis:7-alpine
    container_name: proxy_pool_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - proxypool_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - proxypool-network
    restart: unless-stopped

networks:
  proxypool-network:
    name: omniroute_proxypool-network
    driver: bridge

volumes:
  proxypool_redis_data:
    name: omniroute-proxypool-redis-data
